[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learned-amdi-validation"
version = "1.0.0"
description = "Reproducible validation suite for Learned Adaptive Multiresolution Diffusion Imaging"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "scikit-image>=0.21",
  "pandas>=2.0",
  "torch>=2.3"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["amdi*", "learned_amdi*"]
exclude = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
